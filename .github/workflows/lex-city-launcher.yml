name: Build Lex City RP Launcher

on:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'
      - '.github/workflows/lex-city-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore launcher/LexCityLauncher.csproj

      - name: Publish Windows x64
        run: dotnet publish launcher/LexCityLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/lex-city

      - name: Rename executable
        shell: pwsh
        run: Rename-Item 'publish/lex-city/Lex City RP Launcher.exe' 'Lex City RP Launcher.exe'

      - name: Create distribution ZIP
        shell: pwsh
        run: Compress-Archive -Path 'publish/lex-city/*' -DestinationPath 'Lex-City-RP-Launcher.zip' -Force

      - name: Upload launcher EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lex-City-RP-Launcher
          path: 'publish/lex-city/Lex City RP Launcher.exe'
          if-no-files-found: error

      - name: Upload distribution ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lex-City-RP-Launcher-package
          path: 'Lex-City-RP-Launcher.zip'
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'launcher-v1.0.${{ github.run_number }}'
          name: 'Lex City RP Launcher v1.0.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            Lex City RP Launcher para Windows x64.

            Inclui:
            - Lex City RP Launcher.exe
            - pacote ZIP de distribuição
            - build self-contained .NET 8
          files: |
            publish/lex-city/Lex City RP Launcher.exe
            Lex-City-RP-Launcher.zip
